<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="496" viewBox="0 0 1600 496" role="img" aria-labelledby="title desc">
<title id="title">OOF model bench</title>
<desc id="desc">Three model cards compare OOF ROC-AUC and LogLoss within the same notebook conditions.</desc>
<rect width="1600" height="496" rx="32" fill="#F8FAFC"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="80" y="72" fill="#0B1220" font-size="30" font-weight="830"><tspan>OOF MODEL BENCH</tspan></text></g>
  <text x="80" y="108" fill="#64748B" font-size="17"><tspan>Same notebook · same split / seed / preprocessing context</tspan></text>
  <g data-grid="16">
    <rect x="80" y="160" width="448" height="240" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/>
    <rect x="544" y="160" width="448" height="240" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/>
    <rect x="1008" y="160" width="512" height="240" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>
  <text x="112" y="208" fill="#0284C7" font-size="15" font-weight="820" letter-spacing="2"><tspan>CATBOOST</tspan></text>
  <text x="112" y="274" fill="#0B1220" font-size="42" font-weight="850"><tspan>0.740085</tspan></text>
  <text x="112" y="314" fill="#64748B" font-size="18"><tspan>OOF ROC-AUC</tspan></text>
  <text x="112" y="356" fill="#475569" font-size="20"><tspan>LogLoss 0.586472</tspan></text>

  <text x="576" y="208" fill="#7C5FD1" font-size="15" font-weight="820" letter-spacing="2"><tspan>LIGHTGBM</tspan></text>
  <text x="576" y="274" fill="#0B1220" font-size="42" font-weight="850"><tspan>0.739635</tspan></text>
  <text x="576" y="314" fill="#64748B" font-size="18"><tspan>OOF ROC-AUC</tspan></text>
  <text x="576" y="356" fill="#475569" font-size="20"><tspan>LogLoss 0.586282</tspan></text>

  <text x="1040" y="208" fill="#64748B" font-size="15" font-weight="820" letter-spacing="2"><tspan>XGBOOST</tspan></text>
  <text x="1040" y="274" fill="#0B1220" font-size="42" font-weight="850"><tspan>0.740039</tspan></text>
  <text x="1040" y="314" fill="#64748B" font-size="18"><tspan>OOF ROC-AUC</tspan></text>
  <text x="1040" y="356" fill="#475569" font-size="20"><tspan>LogLoss 0.586374</tspan></text>
</g>
</svg>