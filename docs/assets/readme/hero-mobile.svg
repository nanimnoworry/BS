<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1008" viewBox="0 0 800 1008" role="img" aria-labelledby="title desc">
<title id="title">BS mobile OOF model bench</title><desc id="desc">Mobile research workspace visual with separated title lines and large model cards.</desc>
