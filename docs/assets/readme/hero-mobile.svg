  <text x="96" y="628" fill="#A78BFA" font-size="24" font-weight="820"><tspan>LIGHTGBM</tspan></text><text x="96" y="694" fill="#F8FAFC" font-size="44" font-weight="850"><tspan>OOF 0.739635</tspan></text>
